# CI + GitHub Pages deployment.
#
# M0 (now): run the test suite on every push and pull request.
# M10: add the build (copy site files into _site/) and deploy jobs
#      (actions/upload-pages-artifact -> actions/deploy-pages).
name: CI / Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same Python minor version as the pinned Pyodide release (3.14).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
