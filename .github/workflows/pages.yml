# CI + GitHub Pages deployment.
#
# Every push and pull request: run the full test suite (it also writes
# validation/results.json). On pushes to main only, and only if every test
# passed: assemble the site in _site/ and deploy it to GitHub Pages.
name: CI / Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same Python minor version as the pinned Pyodide release (3.14).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (fails the build on any failure)
        run: pytest -q --cov=ro_model --cov-report=term

      - name: Assemble site
        run: |
          mkdir -p _site/validation
          cp index.html ro_model.py validation.py _site/
          cp -r assets _site/
          cp validation/results.json _site/validation/
          cp docs/transcript.md _site/transcript.md
          touch _site/.nojekyll
          ls -R _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
